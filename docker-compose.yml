version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - chat-network

  webserver:
    image: nginx:alpine
    container_name: chat_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - chat-network

  db:
    image: postgres:15-alpine # أو mysql لو مفضلها
    container_name: chat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-chat_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chat-network

  redis:
    image: redis:alpine
    container_name: chat_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - chat-network
  # laravel websocket server
  

networks:
  chat-network:
    driver: bridge

volumes:
  pgdata:
